version: 2

before:
  hooks:
    - go mod download

builds:
  - env:
      - CGO_ENABLED=0
    # Inject only the version; the commit comes from Go's embedded VCS info.
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# macOS codesigning + notarization, copied from the circleci-cli setup.
# Quill signs/notarizes from any OS (incl. Linux), so no macOS runner is needed.
# Enabled only when QUILL_SIGN_P12 is present (provided by the macos-codesigning context).
notarize:
  macos:
    - enabled: '{{ isEnvSet "QUILL_SIGN_P12" }}'
      sign:
        certificate: '{{ envOrDefault "QUILL_SIGN_P12" "" }}'
      notarize:
        issuer_id: '{{ envOrDefault "QUILL_NOTARY_ISSUER" "" }}'
        key_id: '{{ envOrDefault "QUILL_NOTARY_KEY_ID" "" }}'
        key: '{{ envOrDefault "QUILL_NOTARY_KEY" "" }}'

checksum:
  name_template: checksums.txt

release:
  github:
    owner: CircleCI-Public
    name: npm-trusted-publishing-tool
  # prerelease is derived from the tag (auto): main's clean 1.0.<build> tag is a
  # full release; the next branch's 1.0.<build>-next tag is a semver prerelease.
  # make_latest is set per-build by CI: main=true, next=false
  # (prerelease is not templateable, but make_latest is). See .circleci/config.yml.
  prerelease: auto
  make_latest: '{{ envOrDefault "GORELEASER_MAKE_LATEST" "false" }}'
