version: 2.1

orbs:
  go: circleci/go@3.0.4

executors:
  go:
    docker:
      - image: cimg/go:1.26.4

commands:
  setup:
    description: Checkout and restore Go module + build caches.
    steps:
      - checkout
      - restore_cache:
          name: Restore Go caches
          keys:
            - go-{{ checksum "go.sum" }}-{{ checksum "tools/go.sum" }}-{{ .Environment.CIRCLE_JOB }}
            - go-{{ checksum "go.sum" }}-{{ checksum "tools/go.sum" }}-
            - go-{{ checksum "go.sum" }}-
      - run:
          name: Download modules
          command: |
            go mod download
            go mod download -modfile=tools/go.mod
  save:
    description: Save Go module + build caches.
    steps:
      - save_cache:
          name: Save Go caches
          key: go-{{ checksum "go.sum" }}-{{ checksum "tools/go.sum" }}-{{ .Environment.CIRCLE_JOB }}
          paths:
            - /home/circleci/go/pkg/mod
            - /home/circleci/.cache/go-build
  goreleaser:
    description: Run the pinned GoReleaser (tools/go.mod) with the given args.
    parameters:
      args:
        type: string
    steps:
      - run:
          name: goreleaser << parameters.args >>
          command: go tool -modfile=tools/go.mod goreleaser << parameters.args >>

jobs:
  test:
    executor: go
    steps:
      - setup
      - run:
          name: Run tests
          command: go test ./...
      - save

  build:
    executor: go
    steps:
      - setup
      - goreleaser:
          args: build --snapshot --clean
      - store_artifacts:
          path: dist
      - save

  publish:
    executor: go
    steps:
      - setup
      - run:
          name: Tag the release version
          # Version is MAJOR.MINOR.<CIRCLE_BUILD_NUM>: bump MAJOR.MINOR by hand below;
          # the CI build number is the patch. GoReleaser signs/publishes from this
          # tag. This job only runs on main and next (see the workflow filter):
          #   main -> 1.0.<build>       (clean tag => official, Latest)
          #   next -> 1.0.<build>-next  (semver prerelease => not Latest)
          # `prerelease: auto` in .goreleaser.yml derives that from the tag shape.
          command: |
            BASE="1.0"
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              VERSION="${BASE}.${CIRCLE_BUILD_NUM}"
              MAKE_LATEST="true"
            else
              # next: prerelease, not Latest.
              VERSION="${BASE}.${CIRCLE_BUILD_NUM}-next"
              MAKE_LATEST="false"
            fi
            git tag "$VERSION"
            echo "export GORELEASER_MAKE_LATEST=$MAKE_LATEST" >> "$BASH_ENV"
            echo "Tagged $VERSION (make_latest=$MAKE_LATEST)"
      - goreleaser:
          # Cross-compiles, signs/notarizes the macOS binaries via Quill, and
          # creates the GitHub release. Credentials come from the contexts below:
          #   devex-release      -> GITHUB_TOKEN (create the release)
          #   macos-codesigning  -> QUILL_SIGN_P12 / QUILL_NOTARY_* (sign + notarize)
          args: release --clean
      - store_artifacts:
          path: dist
      - save

workflows:
  ci:
    jobs:
      - test
      - build:
          requires:
            - test
      - publish:
          requires:
            - build
          context:
            - devex-release
            - macos-codesigning
          # Only publish from main (official, Latest) and next (prerelease).
          filters:
            branches:
              only:
                - main
                - next
