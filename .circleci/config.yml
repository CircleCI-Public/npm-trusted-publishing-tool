version: 2.1

orbs:
  go: circleci/go@3.0.4

executors:
  go:
    docker:
      - image: cimg/go:1.26.4

commands:
  setup:
    description: Checkout and restore Go module + build caches.
    steps:
      - checkout
      - restore_cache:
          name: Restore Go caches
          keys:
            - go-{{ checksum "go.sum" }}-{{ checksum "tools/go.sum" }}-{{ .Environment.CIRCLE_JOB }}
            - go-{{ checksum "go.sum" }}-{{ checksum "tools/go.sum" }}-
            - go-{{ checksum "go.sum" }}-
      - run:
          name: Download modules
          command: |
            go mod download
            go mod download -modfile=tools/go.mod
  save:
    description: Save Go module + build caches.
    steps:
      - save_cache:
          name: Save Go caches
          key: go-{{ checksum "go.sum" }}-{{ checksum "tools/go.sum" }}-{{ .Environment.CIRCLE_JOB }}
          paths:
            - /home/circleci/go/pkg/mod
            - /home/circleci/.cache/go-build
  goreleaser:
    description: Run the pinned GoReleaser (tools/go.mod) with the given args.
    parameters:
      args:
        type: string
    steps:
      - run:
          name: goreleaser << parameters.args >>
          command: go tool -modfile=tools/go.mod goreleaser << parameters.args >>

jobs:
  test:
    executor: go
    steps:
      - setup
      - run:
          name: Run tests
          command: go test ./...
      - save

  build:
    executor: go
    steps:
      - setup
      - goreleaser:
          args: build --snapshot --clean
      - store_artifacts:
          path: dist
      - save

  publish:
    executor: go
    steps:
      - setup
      - run:
          name: Tag a nightly-style version
          # GoReleaser publishes from a git tag and only signs/notarizes in real
          # release mode (snapshot skips signing). So mint a commit/date-based
          # semver tag at HEAD. This job only runs on main and release/* (see the
          # workflow filter): main = official+latest, release/* = prerelease.
          command: |
            SHA="$(git rev-parse --short HEAD)"
            DATE="$(date -u +%Y%m%d)"
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              CHANNEL="main"
              PRERELEASE="false"
              MAKE_LATEST="true"
            else
              # Sanitize branch name to valid semver prerelease identifiers.
              CHANNEL="$(printf '%s' "$CIRCLE_BRANCH" | tr -c 'a-zA-Z0-9' '-' | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')"
              PRERELEASE="true"
              MAKE_LATEST="false"
            fi
            VERSION="1.0.0-${CHANNEL}.${DATE}.${SHA}"
            git tag "$VERSION"
            {
              echo "export GORELEASER_PRERELEASE=$PRERELEASE"
              echo "export GORELEASER_MAKE_LATEST=$MAKE_LATEST"
            } >> "$BASH_ENV"
            echo "Tagged $VERSION (prerelease=$PRERELEASE, make_latest=$MAKE_LATEST)"
      - goreleaser:
          # Cross-compiles, signs/notarizes the macOS binaries via Quill, and
          # creates the GitHub release. Credentials come from the contexts below:
          #   devex-release      -> GITHUB_TOKEN (create the release)
          #   macos-codesigning  -> QUILL_SIGN_P12 / QUILL_NOTARY_* (sign + notarize)
          args: release --clean
      - store_artifacts:
          path: dist
      - save

workflows:
  ci:
    jobs:
      - test
      - build:
          requires:
            - test
      - publish:
          requires:
            - build
          context:
            - devex-release
            - macos-codesigning
          # Only publish from main (official) and release/* branches (prereleases).
          filters:
            branches:
              only:
                - main
                - /^release\/.*/
